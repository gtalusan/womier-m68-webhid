<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>M68 press probe</title>
<style>
  :root { color-scheme: dark; --bg:#0e0f12; --bg2:#16181d; --bg3:#1e2127; --frame:#2c3038;
          --fg:#d8dbe2; --dim:#6a7180; --ok:#3fd68f; --warn:#e0a13f; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 16px; }
  button { font: inherit; background: var(--bg3); color: var(--fg); border: 1px solid var(--frame);
           border-radius: 6px; padding: 6px 14px; cursor: pointer; }
  button:hover { border-color: #4a5161; }
  .card { background: var(--bg2); border: 1px solid var(--frame); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 8px; font-size: 15px; }
  .meta { color: var(--dim); font-size: 12px; font-family: ui-monospace, monospace; white-space: pre-wrap; margin: 4px 0 10px; }
  .log { font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; background: #0a0b0d;
         border: 1px solid var(--frame); border-radius: 6px; padding: 8px; max-height: 260px; overflow-y: auto; }
  .live { color: var(--ok); font-size: 12px; margin-top: 8px; }
  .warn { border-color: var(--warn); }
  .chip { display: inline-block; background: var(--bg3); border: 1px solid var(--frame); border-radius: 4px;
          padding: 1px 8px; font-size: 12px; color: var(--dim); margin-right: 6px; }
</style>
</head>
<body>
<main>
  <h1>M68 press probe</h1>
  <div class="sub">Open each collection of the keyboard, then <b>type on the board</b>. The card that lights up is the
    channel that carries key events. Multiple &quot;Add collection&quot; clicks open the other interfaces
    (Chrome's chooser lists each matching collection — pick a different entry each time).</div>
  <button id="add">Add collection</button>
  <button id="clear" hidden>Clear logs</button>
  <div id="cards"></div>
  <div class="sub" id="gate" hidden></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const VID = 0x0416, PID = 0x7372;
const NAMES = { 0x04:"A",0x05:"B",0x06:"C",0x07:"D",0x08:"E",0x09:"F",0x0a:"G",0x0b:"H",0x0c:"I",0x0d:"J",
  0x0e:"K",0x0f:"L",0x10:"M",0x11:"N",0x12:"O",0x13:"P",0x14:"Q",0x15:"R",0x16:"S",0x17:"T",0x18:"U",0x19:"V",
  0x1a:"W",0x1b:"X",0x1c:"Y",0x1d:"Z",0x1e:"1",0x1f:"2",0x20:"3",0x21:"4",0x22:"5",0x23:"6",0x24:"7",0x25:"8",
  0x26:"9",0x27:"0",0x28:"Enter",0x29:"Esc",0x2a:"Bsp",0x2b:"Tab",0x2c:"Space",0x2d:"-",0x2e:"=",0x2f:"[",
  0x30:"]",0x31:"\\",0x33:";",0x34:"'",0x36:",",0x37:".",0x38:"/",0x39:"Caps",0x3a:"F1",0x3b:"F2",0x3c:"F3",
  0x3d:"F4",0x3e:"F5",0x3f:"F6",0x40:"F7",0x41:"F8",0x42:"F9",0x43:"F10",0x44:"F11",0x45:"F12",0x46:"PrtSc",
  0x47:"ScrLk",0x48:"Pause",0x49:"Ins",0x4a:"Home",0x4b:"PgUp",0x4c:"Del",0x4d:"End",0x4e:"PgDn",0x4f:"Right",
  0x50:"Left",0x51:"Down",0x52:"Up",0xe0:"LCtrl",0xe1:"LShift",0xe2:"LAlt",0xe3:"LGui",0xe5:"RShift",0xe6:"RAlt" };
const MODS = { 0x01:"LCtrl",0x02:"LShift",0x04:"LAlt",0x08:"LGui",0x10:"RCtrl",0x20:"RShift",0x40:"RAlt",0x80:"RGui" };

function fmtHex(d) { return [...new Uint8Array(d.buffer ?? d)].map((b) => b.toString(16).padStart(2, "0")).join(" "); }

function decodeBoot(data) {
  const b = new Uint8Array(data.buffer ?? data);
  const mods = []; for (const [m, n] of Object.entries(MODS)) if (b[0] & +m) mods.push(n);
  const keys = [];
  for (let i = 2; i < 8; i++) if (b[i]) keys.push(NAMES[b[i]] ?? `0x${b[i].toString(16)}`);
  return { mods, keys };
}

function card(dev) {
  const el = document.createElement("div");
  el.className = "card";
  const colls = dev.collections.map((c) =>
    `usagePage 0x${c.usagePage.toString(16).padStart(4, "0")} usage 0x${c.usage.toString(16)} ` +
    `in:[${c.inputReports.map((r) => r.reportId + "(" + r.items.length + " items," + r.items[0]?.reportSize + "b)").join(",")}] ` +
    `out:[${c.outputReports.map((r) => r.reportId).join(",")}] feat:[${c.featureReports.map((r) => r.reportId).join(",")}]`
  ).join("\n");
  const isKbd = dev.collections.some((c) => c.usagePage === 0x01 && c.usage === 0x06);
  el.innerHTML = `<h2>${dev.productName} <span class="chip">${isKbd ? "boot keyboard" : dev.collections.some((c) => c.usagePage === 0xff00 || c.usagePage === 0xff1b) ? "vendor" : "other"}</span></h2>
    <div class="meta">${colls}</div><div class="log">— waiting for reports —</div><div class="live"></div>`;
  const log = el.querySelector(".log");
  const live = el.querySelector(".live");
  let count = 0, t0 = performance.now(), last = "";
  dev.addEventListener("inputreport", (e) => {
    const t = performance.now();
    const d = new Uint8Array(e.data.buffer ?? e.data);
    count++;
    let line = `${(t - t0).toFixed(0).padStart(5)}ms rid=${e.reportId} [${d.length}] ${fmtHex(d)}`;
    if (isKbd && d.length >= 8) {
      const { mods, keys } = decodeBoot(d);
      line += `   mods=[${mods.join("+")}] keys=[${keys.join(", ")}]`;
      if (keys.length) { last = keys.join("+"); live.textContent = `LIVE → ${last} (${count} reports)`; t0 = t; }
    } else if (d.length > 2) {
      // vendor channel: look for HID usage ids scattered in the report
      const found = [];
      for (const b of d) if (NAMES[b]) found.push(NAMES[b]);
      if (found.length) { line += `   usages?=[${[...new Set(found)].join(", ")}]`; last = [...new Set(found)].join("+"); live.textContent = `LIVE → ${last}`; }
    }
    log.textContent = line + "\n" + log.textContent.split("\n").slice(0, 40).join("\n");
  });
  // arm buttons: the firmware may only stream key reports after the
  // app's session-start queries (the vendor app always queries first)
  const outRep = dev.collections.flatMap((c) => c.outputReports)[0];
  if (outRep) {
    const mkBtn = (label, frames, pace = 250) => {
      const b = document.createElement("button");
      b.textContent = label;
      b.onclick = async () => {
        for (const [cmd, ...payload] of frames) {
          const f = new Uint8Array(64);
          f[0] = outRep.reportId || 1;
          f[1] = cmd;
          payload.forEach((v, i) => { f[2 + i] = v; });
          await dev.sendReport(outRep.reportId, f);
          await new Promise((r) => setTimeout(r, pace));
        }
        b.textContent = label + " — sent, type now";
      };
      el.appendChild(b);
    };
    mkBtn("handshake 0x0D", [[0x0d]]);
    // the app's startup query sequence (notes/09 session flow)
    mkBtn("full session arm", [
      [0x0d], [0x15], [0x07, 1], [0x0a], [0x08, 1], [0x21, 0, 0, 0, 0x18, 4],
      [0x21, 0, 0, 0, 0x18, 9], [0x21, 0, 0, 0, 0x18, 10], [0x02], [0x0e],
      [0x14, 2, 0, 0, 1], [0x01, 0, 0, 0, 1], [0x17, 0, 0, 0, 1, 1],
    ]);
  }
  return el;
}

$("add").addEventListener("click", async () => {
  const gate = $("gate");
  gate.hidden = false;
  if (!navigator.hid) { gate.textContent = "WebHID needs Chrome/Edge — open this page there."; return; }
  try {
    const ds = await navigator.hid.requestDevice({ filters: [{ vendorId: VID, productId: PID }] });
    for (const dev of ds) {
      await dev.open();
      $("cards").appendChild(card(dev));
      $("clear").hidden = false;
      gate.textContent = `opened ${dev.productName} — click "Add collection" again for the other interfaces.`;
    }
  } catch (e) {
    gate.textContent = "chooser cancelled or failed: " + e.message;
  }
});
$("clear").addEventListener("click", () => {
  document.querySelectorAll(".log").forEach((l) => { l.textContent = "— waiting for reports —"; });
  document.querySelectorAll(".live").forEach((l) => { l.textContent = ""; });
});
</script>
</body>
</html>
